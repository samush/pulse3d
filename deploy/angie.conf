# /etc/angie/http.d/kvartira.conf
server {
    listen 80;
    server_name kvartira.example.com;   # ваш домен или IP

    root /var/www/kvartira;
    index index.html;

    # index.html ~0.8 МБ — сжатие заметно ускоряет загрузку
    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }
}
